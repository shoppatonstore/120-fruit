<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <defs>
    <!-- Animated gradient for color cycling -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF0000">
        <animate attributeName="stop-color" values="#FF0000;#FF4444;#FFD700;#FF0000" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#FF4444">
        <animate attributeName="stop-color" values="#FF4444;#FFD700;#FF0000;#FF4444" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#FF0000">
        <animate attributeName="stop-color" values="#FF0000;#FF0000;#FF4444;#FF0000" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Sparkle filter -->
    <filter id="sparkle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <g filter="url(#glow)">
    <!-- Number 1 - Stylized -->
    <path d="M 30 25 Q 25 20, 35 18 L 35 75 Q 35 80, 30 80 L 40 80 Q 35 80, 35 75 L 35 25" 
          fill="url(#logoGradient)" stroke="none">
      <animate attributeName="opacity" values="1;0.9;1" dur="2s" repeatCount="indefinite"/>
    </path>
    
    <!-- Number 2 - Stylized -->
    <path d="M 50 30 Q 50 18, 70 18 Q 90 18, 90 35 Q 90 50, 60 65 L 90 65 L 90 75 L 50 75 L 50 68 Q 85 50, 85 38 Q 85 25, 70 25 Q 55 25, 55 35" 
          fill="url(#logoGradient)" stroke="none">
      <animate attributeName="opacity" values="1;0.95;1" dur="2.5s" repeatCount="indefinite" begin="0.2s"/>
    </path>
    
    <!-- Number 0 as Coconut/Fruit -->
    <ellipse cx="130" cy="50" rx="30" ry="32" fill="url(#logoGradient)">
      <animate attributeName="ry" values="32;33;32" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    
    <!-- Inner hole of 0 (coconut opening) -->
    <ellipse cx="130" cy="52" rx="15" ry="18" fill="#000000" opacity="0.9"/>
    
    <!-- Coconut/Fruit detail - small bite/opening -->
    <path d="M 125 40 Q 130 35, 140 42 Q 135 38, 125 40" fill="#000000" opacity="0.6"/>
    
    <!-- Straw coming out of coconut -->
    <line x1="145" y1="50" x2="165" y2="20" stroke="url(#logoGradient)" stroke-width="4" stroke-linecap="round">
      <animate attributeName="stroke-width" values="4;5;4" dur="1.5s" repeatCount="indefinite"/>
    </line>
    
    <!-- Straw bent tip -->
    <path d="M 165 20 Q 170 15, 175 18" stroke="url(#logoGradient)" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Sparkle effects -->
  <circle cx="170" cy="15" r="3" fill="#FFD700" opacity="0.8" filter="url(#sparkle)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2;4;2" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="155" cy="25" r="2" fill="#FFFFFF" opacity="0.9">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  
  <circle cx="175" cy="22" r="2" fill="#FF4444" opacity="0.7">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  
  <!-- Additional sparkles around the logo -->
  <circle cx="25" cy="20" r="1.5" fill="#FFD700" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  
  <circle cx="95" cy="15" r="1.5" fill="#FFD700" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" begin="1s"/>
  </circle>
  
  <circle cx="105" cy="80" r="1.5" fill="#FFD700" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
</svg>
