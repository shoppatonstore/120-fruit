<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" class="ftp-logo-header-svg">
  <defs>
    <!-- Animated gradient for lively color effect -->
    <linearGradient id="headerLogoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF0000">
        <animate attributeName="stop-color" values="#FF0000;#FF4444;#FFD700;#FF0000" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#FF4444">
        <animate attributeName="stop-color" values="#FF4444;#FFD700;#FF0000;#FF4444" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#FF0000">
        <animate attributeName="stop-color" values="#FF0000;#FF0000;#FF4444;#FF0000" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <filter id="headerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g filter="url(#headerGlow)">
    <!-- Number 1 -->
    <path d="M 8 8 Q 5 5, 12 4 L 12 32 Q 12 35, 8 35 L 16 35 Q 12 35, 12 32 L 12 8" 
          fill="url(#headerLogoGradient)"/>
    
    <!-- Number 2 -->
    <path d="M 22 10 Q 22 3, 38 3 Q 54 3, 54 14 Q 54 24, 30 34 L 54 34 L 54 38 L 22 38 L 22 33 Q 50 20, 50 15 Q 50 7, 38 7 Q 26 7, 26 12" 
          fill="url(#headerLogoGradient)"/>
    
    <!-- Number 0 as Coconut -->
    <ellipse cx="78" cy="20" rx="18" ry="17" fill="url(#headerLogoGradient)"/>
    <ellipse cx="78" cy="21" rx="9" ry="10" fill="#000000" opacity="0.9"/>
    
    <!-- Straw -->
    <line x1="88" y1="18" x2="105" y2="4" stroke="url(#headerLogoGradient)" stroke-width="3" stroke-linecap="round">
      <animate attributeName="stroke-width" values="3;4;3" dur="2s" repeatCount="indefinite"/>
    </line>
    <path d="M 105 4 Q 109 1, 113 3" stroke="url(#headerLogoGradient)" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Sparkles -->
  <circle cx="110" cy="3" r="2" fill="#FFD700" opacity="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1.5;2.5;1.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="102" cy="6" r="1.5" fill="#FFFFFF" opacity="0.7">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
</svg>
