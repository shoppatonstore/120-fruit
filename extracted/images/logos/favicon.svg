<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="favGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF0000">
        <animate attributeName="stop-color" values="#FF0000;#FFD700;#FF0000" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#FF4444">
        <animate attributeName="stop-color" values="#FF4444;#FF0000;#FF4444" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#1B0000" stroke="url(#favGradient)" stroke-width="1">
    <animate attributeName="stroke-width" values="1;2;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Stylized 120 compressed for favicon -->
  <!-- Coconut/0 shape -->
  <ellipse cx="16" cy="16" rx="8" ry="9" fill="url(#favGradient)"/>
  <ellipse cx="16" cy="17" rx="4" ry="5" fill="#1B0000"/>
  
  <!-- Straw -->
  <line x1="20" y1="14" x2="26" y2="6" stroke="url(#favGradient)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 26 6 Q 28 4, 29 5" stroke="url(#favGradient)" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Sparkle -->
  <circle cx="27" cy="5" r="1.5" fill="#FFD700" opacity="0.9">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
